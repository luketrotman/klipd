# Fly.io config. Edit `app` to a unique name before `fly launch --copy-config`.
app = "klipd"
primary_region = "lhr"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  PROCESSING_MODE = "worker"
  NODE_ENV = "production"

[mounts]
  source = "klipd_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
